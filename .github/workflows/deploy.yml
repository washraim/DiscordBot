name: Deploy Discord bot to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: discordbot-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Deploy latest main and confirm Discord login
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          umask 077
          key_file="$RUNNER_TEMP/discordbot-key"
          hosts_file="$RUNNER_TEMP/discordbot-known-hosts"
          trap 'rm -f -- "$key_file" "$hosts_file"' EXIT
          test -n "$VPS_SSH_KEY" || { echo 'VPS_SSH_KEY is missing'; exit 1; }
          test -n "$VPS_KNOWN_HOSTS" || { echo 'VPS_KNOWN_HOSTS is missing'; exit 1; }
          printf '%s\n' "$VPS_SSH_KEY" > "$key_file"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$hosts_file"
          ssh -T -i "$key_file" -p 22 \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts_file" \
            -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            discordbot-deploy@195.133.35.40 deploy
